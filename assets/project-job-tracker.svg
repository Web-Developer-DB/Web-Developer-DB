<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="110" viewBox="0 0 1040 110" role="img" aria-labelledby="title desc">
  <!-- Pflege: Vorlage für Projektbanner (1040 × 110): Nummer/Kategorie oben, Projektname darunter, kleines Icon rechts. Zum Kopieren title/desc, Nummer, Kategorie, Name und Icon anpassen; Reihenfolge und Alt-Text mit README.md abgleichen. Eigenständige SVG, keine externen Ressourcen. -->
