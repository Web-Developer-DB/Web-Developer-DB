<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
  <title id="title">CarService Backend · Architektur der REST-API v2</title>
  <desc id="description">Ein Web-Client verwendet die REST-API mit Bearer- und CSRF-Token. Die API nutzt MongoDB für Fahrzeug- und Wartungsdaten, Redis für Sitzungen und Anfragebegrenzung sowie SMTP für E-Mail-Verifikation und Passwort-Reset.</desc>
